<title>SV PRIME EDITS - Poster Maker</title></head>
<body style="background:#06070a;color:#eee;font-family:sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">
<p>Opening Poster Maker&hellip; <a id="go" style="color:#7fd4ff" href="https://svofficials9999-collab.github.io/prime-edits/poster-maker.html">Tap here if it does not open</a></p>
<script>
(function(){var T='https://svofficials9999-collab.github.io/prime-edits/poster-maker.html'+(location.hash||'');document.getElementById('go').href=T;var done=false;function go(){if(done)return;done=true;location.replace(T)}setTimeout(go,1500);
(async()=>{try{if('serviceWorker' in navigator){const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs){await r.unregister();}}if(window.caches){const ks=await caches.keys();for(const k of ks){await caches.delete(k);}}}catch(e){}go();})();})();
</script></body></html>
